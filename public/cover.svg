<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Keyboard Beat Lab cover art</title>
  <desc id="desc">Abstract rhythm game album art with falling notes and a keyboard-shaped horizon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102031"/>
      <stop offset="0.45" stop-color="#172837"/>
      <stop offset="1" stop-color="#0b1017"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5bf2d4" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#ff6b7a" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="640" height="640" rx="54" fill="url(#bg)"/>
  <g opacity="0.9">
    <path d="M116 520 246 106h148l130 414Z" fill="url(#beam)" opacity="0.35"/>
    <path d="M206 520 286 104h68l80 416Z" fill="#5bf2d4" opacity="0.12"/>
  </g>
  <g filter="url(#glow)">
    <rect x="216" y="124" width="42" height="88" rx="14" fill="#5bf2d4"/>
    <rect x="302" y="186" width="42" height="112" rx="14" fill="#f8ff7a"/>
    <rect x="384" y="140" width="42" height="78" rx="14" fill="#ff6b7a"/>
    <rect x="272" y="344" width="96" height="18" rx="9" fill="#ffffff"/>
  </g>
  <g transform="translate(90 498)">
    <rect width="460" height="58" rx="18" fill="#060a10" opacity="0.78"/>
    <g fill="#273849">
      <rect x="18" y="16" width="34" height="26" rx="7"/>
      <rect x="60" y="16" width="34" height="26" rx="7"/>
      <rect x="102" y="16" width="34" height="26" rx="7"/>
      <rect x="144" y="16" width="34" height="26" rx="7"/>
      <rect x="186" y="16" width="34" height="26" rx="7"/>
      <rect x="228" y="16" width="34" height="26" rx="7"/>
      <rect x="270" y="16" width="34" height="26" rx="7"/>
      <rect x="312" y="16" width="34" height="26" rx="7"/>
      <rect x="354" y="16" width="34" height="26" rx="7"/>
      <rect x="396" y="16" width="46" height="26" rx="7"/>
    </g>
    <rect x="158" y="34" width="144" height="10" rx="5" fill="#5bf2d4" opacity="0.85"/>
  </g>
</svg>
